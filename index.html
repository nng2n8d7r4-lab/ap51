<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP51</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AP51">
<style>
body{margin:0;background:linear-gradient(135deg,#e0e7ff,#fce7f3,#dbeafe);font-family:-apple-system,system-ui;color:#1c1c1e;padding:20px;}
h1{font-size:36px;background:linear-gradient(90deg,#0a84ff,#bf5af2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:4px 0;}
.signal{background:rgba(255,255,255,.6);backdrop-filter:blur(40px);border-radius:28px;padding:32px;text-align:center;margin:16px 0;}
.card{background:rgba(255,255,255,.5);border-radius:20px;padding:16px;margin:8px 0;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.refresh{width:100%;padding:16px;background:linear-gradient(90deg,#0a84ff,#bf5af2);color:#fff;border:none;border-radius:16px;font-size:17px;font-weight:600;margin-top:16px;}
input{width:100%;padding:12px;font-size:18px;border-radius:12px;border:1px solid #ccc;margin-top:8px;}
</style>
</head>
<body>
<h1>AP51</h1>
<div>Neúspěšný breakdown · SPX / ES</div>
<div class="signal" id="signalBox">
<div>AKTUÁLNÍ STAV</div>
<div style="font-size:40px;font-weight:700" id="signalText">ČEKEJ</div>
<div id="signalTime">SPX</div>
<div id="reason">Žádný aktivní signál.</div>
</div>
<div class="grid">
<div class="card"><div>Úroveň FBD</div><div style="font-size:26px;font-weight:600" id="fbdLevel">7684.8</div></div>
<div class="card"><div>Aktuální cena</div><div style="font-size:26px;font-weight:600" id="price">—</div></div>
</div>
<div class="card" id="manualBox">
<div id="manualLabel">Prosím doplňte aktuální cenu SPX</div>
<input id="manualInput" type="number" step="0.01" placeholder="např. 7705">
<button class="refresh" id="saveBtn" style="margin-top:8px">Uložit cenu</button>
</div>
<button class="refresh" id="refreshBtn">Obnovit</button>
<script>
const LEVELS={SPX:7684.8,ES:7737.2};
let instrument='SPX';
let level=LEVELS.SPX;
const hist=[];
function isMarketOpen(){
  const d=new Date();
  const h=d.getUTCHours()+2;
  const m=h*60+d.getUTCMinutes();
  return m>=930&&m<1320;
}
function updateInstrument(){
  instrument=isMarketOpen()?'SPX':'ES';
  level=LEVELS[instrument];
  document.getElementById('fbdLevel').textContent=level;
  document.getElementById('signalTime').textContent=instrument;
  document.getElementById('manualLabel').textContent='Prosím doplňte aktuální cenu '+instrument;
}
document.getElementById('refreshBtn').onclick=()=>{
  updateInstrument();
  document.getElementById('manualBox').style.display='block';
};
document.getElementById('saveBtn').onclick=()=>{
  const p=parseFloat(document.getElementById('manualInput').value);
  if(!p)return;
  document.getElementById('price').textContent=p;
  hist.push(p);
  const recentLow=Math.min(...hist.slice(-10));
  const undercut=recentLow<level-1;
  const reclaimed=p>level;
  const box=document.getElementById('signalBox');
  const txt=document.getElementById('signalText');
  const reason=document.getElementById('reason');
  if(undercut&&reclaimed){
    box.style.background='rgba(48,209,88,.2)';
    txt.textContent='VSTUP LONG';
    reason.textContent='Reclaim nad '+level+' po podstřelu.';
  }else{
    box.style.background='rgba(255,255,255,.6)';
    txt.textContent='ČEKEJ';
    reason.textContent=undercut?'Čekám na reclaim nad '+level:'Žádný podstřel.';
  }
  document.getElementById('manualInput').value='';
};
updateInstrument();
</script>
</body>
</html>
